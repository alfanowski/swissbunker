<!doctype html>
<meta charset="utf-8">
<title>P4</title>
<style>body{font:14px/1.6 ui-monospace,monospace;margin:2rem;max-width:80ch}pre{background:#f4f4f5;padding:1rem;border-radius:8px;overflow-x:auto}</style>
<h1>P4 — SQLite over range reads</h1>
<p>Select the <code>SWISSTEST</code> volume. The probe looks for <code>fts-test.sqlite</code>.</p>
<input type="file" id="dir-input" webkitdirectory multiple>
<pre id="probe-output"></pre>
<script src="lib/probe.js"></script>
<script src="lib/file-vfs.js"></script>
<!-- Both built by tools/build-vendor.sh. Absent until then, which check 6 reports rather
     than crashes on: the first five checks are worth running without them. -->
<script src="vendor/sql-wasm.js" onerror="console.warn('sql.js not vendored yet')"></script>
<script src="vendor/sql-wasm-binary.js" onerror="console.warn('wasm binary not inlined yet')"></script>
<script>
(function () {
  Probe.init('p4', 'SQLite over range reads');

  document.getElementById('dir-input').addEventListener('change', async function (e) {
    var files = Array.prototype.slice.call(e.target.files);
    var db = files.filter(function (f) { return f.name === 'fts-test.sqlite'; })[0];

    if (!db) {
      await Probe.check('fixture_found', function () { return false; });
      Probe.finish();
      return;
    }

    await Probe.check('fixture_found', function () { return true; });
    Probe.info('database', { bytes: db.size, GB: Math.round(db.size / 1e9 * 100) / 100 });

    var reader = new LazyFileReader(db, { chunkSize: 1024 * 1024 });

    // 1. The cheapest possible proof the reader works: the first 15 bytes of any SQLite
    //    file are the literal header string.
    await Probe.check('sqlite_header_valid', async function () {
      await reader.prefetch(0, 100);
      var head = reader.readSync(0, 15);
      if (!head) { return 'cache miss on the first page'; }
      return new TextDecoder().decode(head) === 'SQLite format 3';
    });

    // 2. Page size and page count come from the header, proving we can navigate the file's
    //    own structure rather than merely read arbitrary bytes.
    await Probe.check('header_fields_sane', async function () {
      await reader.prefetch(0, 100);
      var head = reader.readSync(0, 100);
      if (!head) { return 'cache miss'; }
      var dv = new DataView(head.buffer, head.byteOffset, head.byteLength);
      var pageSize = dv.getUint16(16);          // a stored value of 1 means 65536
      if (pageSize === 1) { pageSize = 65536; }
      var pageCount = dv.getUint32(28);
      Probe.info('sqlite_header', { pageSize: pageSize, pageCount: pageCount,
                                    impliedBytes: pageSize * pageCount });
      return pageSize === 4096 && pageCount > 0;
    });

    // 3. Read amplification: how many bytes must be pulled to answer one FTS5 query?
    //    This is the number that decides whether the design meets NF2, so it is measured
    //    rather than estimated. An FTS5 term lookup touches the term index B-tree (a few
    //    pages), then a doclist (contiguous), then content rows (scattered) — roughly 40
    //    page touches, simulated here over the real file layout.
    var bytesBefore = reader.stats.bytesRead;
    await Probe.measure('simulated_fts_query_ms', async function () {
      for (var i = 0; i < 40; i++) {
        var off = Math.floor(Math.random() * Math.max(0, db.size - 4096));
        await reader.prefetch(off, 4096);
        reader.readSync(off, 4096);
      }
    }, 20);

    Probe.info('reader_stats_after_simulation', JSON.parse(JSON.stringify(reader.stats)));
    // The delta across the measured runs only — reader.stats.bytesRead is cumulative from
    // page load and would otherwise fold the header prefetch into the per-query figure.
    Probe.info('bytes_per_simulated_query',
      Math.round((reader.stats.bytesRead - bytesBefore) / 20));

    // 4. Memory ceiling: the cache must never approach the heap limit. If a 10 GB database
    //    forces the cache past ~500 MB to stay useful, the chunk size is wrong.
    await Probe.check('cache_stayed_bounded', function () {
      var cachedBytes = reader.cache.size * reader.chunkSize;
      Probe.info('cache_bytes', cachedBytes);
      return cachedBytes < 500 * 1024 * 1024;
    });

    // 5. Heap headroom, to confirm constraint V4 (4 GB WASM32 heap) empirically.
    await Probe.check('heap_headroom', function () {
      if (!performance.memory) { return 'performance.memory unavailable in this browser'; }
      return {
        usedMB: Math.round(performance.memory.usedJSHeapSize / 1e6),
        limitMB: Math.round(performance.memory.jsHeapSizeLimit / 1e6)
      };
    });

    // 6. Does FTS5 actually work inside WASM? The small companion database fits in memory,
    //    so this isolates the query engine from the lazy-reading question. The fixture
    //    planted "xyzzyneedlemarker" in exactly one row, titled "Document 13370", so the
    //    correct answer is known in advance rather than merely plausible.
    await Probe.check('fts5_engine_works', async function () {
      if (typeof initSqlJs !== 'function') {
        return 'sql.js not vendored — run tools/build-vendor.sh, then reload';
      }
      if (!window.SQL_WASM_BINARY) { return 'wasm binary not inlined'; }
      var small = files.filter(function (f) { return f.name === 'fts-small.sqlite'; })[0];
      if (!small) { return 'fts-small.sqlite not found in the selected directory'; }

      // Passing wasmBinary skips Emscripten's fetch of the .wasm entirely, which is the
      // one part of sql.js init that a null origin would block.
      var SQL = await initSqlJs({ wasmBinary: window.SQL_WASM_BINARY });
      var t0 = performance.now();
      var bytes = new Uint8Array(await small.arrayBuffer());
      var loadMs = performance.now() - t0;
      var handle = new SQL.Database(bytes);
      var t1 = performance.now();
      var rows = handle.exec("SELECT title FROM docs WHERE docs MATCH 'xyzzyneedlemarker'");
      var queryMs = performance.now() - t1;
      handle.close();
      Probe.info('small_db', { bytes: small.size, loadMs: Math.round(loadMs),
                               queryMs: Math.round(queryMs * 100) / 100 });
      if (!rows.length || !rows[0].values.length) { return 'needle not found'; }
      return { title: rows[0].values[0][0], expected: 'Document 13370' };
    });

    // 7. Does this sql.js build expose Emscripten's lazy-file support at all?
    //    The design assumed it did. Recording the answer either way matters more than the
    //    answer itself: if it is absent, Phase 1 needs a custom SQLite WASM build with a
    //    real VFS, which is a materially different amount of work.
    await Probe.check('sqljs_exposes_lazy_file', async function () {
      if (typeof initSqlJs !== 'function') { return 'sql.js not vendored'; }
      var SQL = await initSqlJs({ wasmBinary: window.SQL_WASM_BINARY });
      return {
        createLazyFile: typeof (SQL.FS && SQL.FS.createLazyFile),
        createPreloadedFile: typeof (SQL.FS && SQL.FS.createPreloadedFile),
        registerDevice: typeof (SQL.FS && SQL.FS.registerDevice),
        mount: typeof (SQL.FS && SQL.FS.mount),
        note: 'absent means Phase 1 needs a custom SQLite WASM build with a VFS'
      };
    });

    // 8. Can a Blob URL serve HTTP Range requests, synchronously?
    //    This is the pivotal question for Phase 1. SQLite's VFS demands SYNCHRONOUS reads,
    //    File.slice() is asynchronous, and a null origin denies SharedArrayBuffer — so the
    //    usual worker-plus-Atomics.wait bridge is unavailable. A synchronous XHR against a
    //    Blob URL of a file slice is the only remaining route to a blocking read, and
    //    whether it works decides how the search engine can be built at all.
    await Probe.check('blob_url_sync_range_read', function () {
      try {
        // Slice first, then make a Blob URL of just that range: this sidesteps the
        // question of whether Blob URLs honour a Range header, which they generally do not.
        var slice = db.slice(1000000, 1000000 + 4096);
        var url = URL.createObjectURL(slice);
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, false);   // synchronous — the whole point of the check
        // responseType is forbidden on synchronous XHR in a window context, so fall back to
        // the classic binary-through-text trick Emscripten itself uses.
        xhr.overrideMimeType('text/plain; charset=x-user-defined');
        var t0 = performance.now();
        xhr.send(null);
        var elapsed = performance.now() - t0;
        URL.revokeObjectURL(url);
        var len = xhr.responseText ? xhr.responseText.length : 0;
        return {
          status: xhr.status,
          bytesReturned: len,
          correctLength: len === 4096,
          syncReadMs: Math.round(elapsed * 100) / 100
        };
      } catch (err) {
        return 'sync XHR on a Blob URL failed: ' + err.message;
      }
    });

    Probe.finish();
  });
}());
</script>
