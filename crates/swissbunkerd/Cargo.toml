[package]
name = "swissbunkerd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
async-stream = "0.3.6"
axum = { version = "0.8", features = ["tokio"] }
futures-core = "0.3.34"
# `bundled` compiles SQLite from source rather than linking the system library: the daemon
# ships on the disk and runs on machines whose SQLite version is unknown and unmanaged.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-stream = "0.1.19"
tower-http = { version = "0.7.0", features = ["fs"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
