name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Relative markdown links are the ones that rot silently on rename.
      # Zero dependencies on purpose: this must keep working offline and unattended.
      # Relative markdown links are the ones that rot silently on rename.
      # Zero dependencies on purpose: this must keep working offline and unattended.
      - name: Check relative links
        run: |
          broken=$(mktemp)
          find . -name '*.md' -not -path './node_modules/*' -not -path './target/*' \
            -print0 | while IFS= read -r -d '' md; do
              dir=$(dirname "$md")
              # Pull (target) out of markdown links; skip external URLs and pure anchors.
              grep -oE '\]\([^)]+\)' "$md" \
                | sed -E 's/^\]\(//; s/\)$//; s/#.*$//' \
                | grep -vE '^(https?:|mailto:|$)' \
                | while IFS= read -r target; do
                    [ -e "$dir/$target" ] \
                      || echo "::error file=$md::broken link -> $target" >> "$broken"
                  done
            done
          # The loops above run in subshells, so failures are collected in a file
          # rather than a variable — a shell variable set inside a pipe never
          # propagates back to the parent.
          if [ -s "$broken" ]; then cat "$broken"; exit 1; fi
          echo "All relative links resolve."

      - name: Check required files
        run: |
          for f in README.md LICENSE CHANGELOG.md .gitignore \
                   docs/specs/2026-08-18-swissbunker-design.md; do
            [ -f "$f" ] || { echo "::error::missing required file: $f"; exit 1; }
          done
          echo "Repository structure intact."

  # hashFiles() is evaluated on the runner, so it cannot gate a job-level `if`.
  # This job does the filesystem check after checkout and publishes the answer,
  # letting the language jobs switch themselves on the moment code lands.
  detect:
    name: Detect components
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.probe.outputs.rust }}
      web: ${{ steps.probe.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - id: probe
        run: |
          [ -f Cargo.toml ] && echo "rust=true" >> "$GITHUB_OUTPUT" || echo "rust=false" >> "$GITHUB_OUTPUT"
          [ -f web/package.json ] && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  web:
    name: Web
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Build first: it generates src/generated/wasm-binary.ts, which the sources import and
      # which is deliberately not committed — it is 1.1 MB of base64 derived from a file in
      # node_modules. Typechecking before the build fails on a module that does not exist yet.
      - run: npm run build
      - run: npm run typecheck
      # The test fixture is a generated SQLite file, not committed: it is reproducible from
      # a seeded script, and a binary blob in git that a script can rebuild is a liability.
      # Without it the suite opens an empty database and fails with "no such table: docs".
      - run: python3 tools/make-tiny-fixture.py
      # The unit suite runs in a real browser: Blob, synchronous XHR and File exist nowhere
      # else, so a headless-Node run would pass against stubs and prove nothing.
      - run: npx playwright install --with-deps chromium
      - run: npm test
